<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>Luxury VMS — ملف</title>
<meta name="theme-color" content="#0F1B2D">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#F3F4F7;--surface:#fff;--fg:#151A23;--muted:#5E6675;--line:#DDE1E8;--accent:#9A7330;--navy:#0F1B2D;--warn:#B4541A;
--display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F1218;--surface:#181D26;--fg:#E9ECF1;--muted:#99A1AF;--line:#2A313D;--accent:#C9A15A;--warn:#E08A50;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;padding:20px 16px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{font-family:Didot,"Bodoni 72",Georgia,serif;letter-spacing:.18em;font-size:22px;text-align:center;color:var(--fg)}
.brand small{display:block;font-family:var(--body);letter-spacing:0;font-size:12px;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
h1{font-family:var(--display);font-size:17px;margin:0 0 4px;word-break:break-word}
.muted{color:var(--muted);font-size:13px}
button{font:inherit;cursor:pointer;width:100%;border:0;border-radius:12px;padding:15px;font-weight:600;font-size:16px}
.main{background:#1E8E5A;color:#fff;font-family:var(--display);font-size:18px}
.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line);margin-top:10px}
button:disabled{opacity:.5}
.msg{min-height:20px;font-size:14px;text-align:center;margin-top:8px}.msg.err{color:var(--warn)}
iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">LUXURY VMS<small>Luxury Vehicle Maintenance Services</small></div>
  <div class="card">
    <h1 id="name">بيحمّل الملف…</h1>
    <div class="muted" id="hint"></div>
    <div id="acts" hidden>
      <button class="main" id="share">📲 ابعت الملف (واتساب / إيميل / …)</button>
      <button class="sec" id="dl">⬇️ تنزيل PDF</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <iframe id="view" title="الملف" hidden></iframe>
</div>
<script>
const OPS = 'https://script.google.com/macros/s/AKfycbxwXpKR8Le67ijMB5piBEgDF5E4WKtxXjlwoPCzjN6bvqEB0wuw2OWakVGGJk5-2FFiKQ/exec';
const $ = id => document.getElementById(id);
let FILE = null, URLX = null;
function msg(t, err){ $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }
async function load(){
  const t = location.hash.replace('#', '');
  try {
    const r = await fetch(OPS, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({fn: 'docGet', t})});
    const j = await r.json(); if (!j.ok) throw new Error(j.error);
    const bin = atob(j.data.b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    FILE = new File([a], j.data.name, {type: 'application/pdf'}); URLX = URL.createObjectURL(FILE);
    document.title = j.data.name; $('name').textContent = j.data.name; $('acts').hidden = false;
    const canShare = navigator.canShare && navigator.canShare({files: [FILE]});
    $('share').hidden = !canShare;
    $('hint').textContent = canShare ? 'اختار WhatsApp وابعته للعميل — هيوصل كملف PDF.' : 'الجهاز ده مش بيدعم الشير المباشر. نزّل الملف وابعته كمرفق.';
    $('view').src = URLX; $('view').hidden = false;
  } catch (e) { $('name').textContent = 'الملف مش متاح'; msg(e.message || 'جرّب تاني', true); }
}
$('share').onclick = async () => {
  try { await navigator.share({files: [FILE], title: FILE.name}); }
  catch (e) { if (e && e.name !== 'AbortError') msg('الشير مش متاح — نزّل الملف وابعته كمرفق', true); }
};
$('dl').onclick = () => { const a = document.createElement('a'); a.href = URLX; a.download = FILE.name; document.body.append(a); a.click(); a.remove(); };
load();
</script>
</body>
</html>
